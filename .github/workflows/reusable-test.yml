name: Test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
    inputs:
      event_name:
        required: false
        type: string
        default: "pull_request"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Docker layers cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.buildx-mounted-cache
          key: ${{ runner.os }}-${{ runner.arch }}-buildx-dev-${{ hashFiles('Pipfile.lock', 'docker/dev.Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildx-dev-

      - name: inject cache into docker
        uses: reproducible-containers/buildkit-cache-dance@v3.3.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/.buildx-mounted-cache": "/root/.cache/pip"
            }
          skip-extraction: ${{ steps.cache-restore.outputs.cache-hit }}

      - name: Create new cache
        run: |
          mkdir -p ${{ runner.temp }}/.buildx-cache
          mkdir -p ${{ runner.temp }}/.buildx-cache-new
          mkdir -p ${{ runner.temp }}/.buildx-mounted-cache

      - name: Build images
        run: |
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --cache-from=type=local,src=${{ runner.temp }}/.buildx-cache \
            --cache-to=type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max \
            --platform linux/arm64 \
            --load \
            .

      - name: Test MinIO image pull
        run: docker pull dappros/minio:RELEASE.2025-09-07T16-13-09Z

      - name: Start services
        run: |
          set -euo pipefail
      
          COMPOSE="docker compose -f docker-compose.yaml -f docker-compose.local.yaml"
      
          echo "===== START DEPENDENCIES ====="
          $COMPOSE up -d db redis minio
      
          echo "===== BUILD APPLICATION IMAGE ====="
          $COMPOSE build backend celery
      
          echo "===== START CELERY ====="
          $COMPOSE up -d --no-deps celery
      
          echo "===== WAIT FOR CELERY HEALTH ====="
          for i in $(seq 1 36); do
            STATUS=$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              openhealthcare-celery-1)
      
            echo "Attempt $i/36: Celery status = $STATUS"
      
            if [ "$STATUS" = "healthy" ]; then
              echo "===== CELERY HEALTHY ====="
              break
            fi
      
            if [ "$STATUS" = "unhealthy" ]; then
              echo "===== CELERY LOGS ====="
              $COMPOSE logs --tail=200 celery
              exit 1
            fi
      
            sleep 10
          done
      
          if [ "$STATUS" != "healthy" ]; then
            echo "Celery did not become healthy within 6 minutes"
            $COMPOSE logs --tail=200 celery
            docker inspect openhealthcare-celery-1 \
              --format '{{json .State.Health}}'
            exit 1
          fi
      
          echo "===== START BACKEND ====="
          $COMPOSE up -d backend
      
          echo "===== FINAL SERVICE STATUS ====="
          $COMPOSE ps
      
      - name: Diagnose backend and celery startup
        run: |
          echo "===== LOCAL COMPOSE FILE ====="
          cat docker-compose.local.yaml
      
          echo
          echo "===== COMPOSE PROFILES ====="
          docker compose -f docker-compose.yaml -f docker-compose.local.yaml config --profiles
      
          echo
          echo "===== ALL SERVICES ====="
          docker compose -f docker-compose.yaml -f docker-compose.local.yaml config --services
      
          echo
          echo "===== ALL CONTAINERS INCLUDING EXITED ====="
          docker compose -f docker-compose.yaml -f docker-compose.local.yaml ps -a
      
          echo
          echo "===== BACKEND LOGS ====="
          docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs --no-color backend || true
      
          echo
          echo "===== CELERY LOGS ====="
          docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs --no-color celery || true
                
      - name: Check backend container status
        if: always()
        run: |
          echo "===== COMPOSE SERVICES ====="
          docker compose config --services

          echo
          echo "===== ALL CONTAINER STATUS ====="
          docker compose ps -a

          echo
          echo "===== BACKEND LOGS ====="
          docker compose logs --no-color --tail=200 backend || true

          echo
          echo "===== CELERY LOGS ====="
          docker compose logs --no-color --tail=100 celery || true    
      - name: Diagnose Docker Compose services
        run: |
          echo "===== COMPOSE FILES ====="
          ls -l docker-compose.yaml docker-compose.local.yaml
      
          echo
          echo "===== BASE SERVICES ====="
          docker compose -f docker-compose.yaml config --services
      
          echo
          echo "===== COMBINED SERVICES ====="
          docker compose -f docker-compose.yaml -f docker-compose.local.yaml config --services
      
          echo
          echo "===== LOCAL COMPOSE SERVICE DEFINITIONS ====="
          grep -nE '^(services:|  [A-Za-z0-9_.-]+:)' docker-compose.local.yaml
      
          echo
          echo "===== COMBINED CONTAINER STATUS ====="
          docker compose -f docker-compose.yaml -f docker-compose.local.yaml ps -a   

      - name: Check missing migrations
        run: make checkmigration

      - name: Validate integrity of fixtures
        run: make load-fixtures

      - name: Dump db
        if: ${{ inputs.event_name == 'push' || github.event_name == 'push' }}
        run: make dump-db

      - name: Run tests
        run: make test-coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

      - name: Save Docker layers cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.buildx-mounted-cache
          key: ${{ runner.os }}-${{ runner.arch }}-buildx-dev-${{ hashFiles('Pipfile.lock', 'docker/dev.Dockerfile') }}

      # Upload dummy db as artifact so it can be used to speed up frontend tests
      - name: Dump db
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: make dump-db

      - name: Upload db artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@v5
        with:
          name: care-db-dump
          path: care_db.dump
          retention-days: 30
          compression-level: 0 # file is already compressed
