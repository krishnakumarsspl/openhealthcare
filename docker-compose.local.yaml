services:
  backend:
    image: care_local
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        ADDITIONAL_PLUGS: ${ADDITIONAL_PLUGS:-}
    env_file:
      - ./docker/.local.env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
    volumes:
      - .:/app
    entrypoint: ["bash", "scripts/start-dev.sh"]
    ports:
      - "9000:9000"
      - "9876:9876"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      celery:
        condition: service_healthy

  celery:
    image: care_local
    env_file:
      - ./docker/.local.env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
    entrypoint: ["bash", "scripts/celery-dev.sh"]
    restart: unless-stopped
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
