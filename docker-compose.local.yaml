services:
  backend:
    image: care_local
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        ADDITIONAL_PLUGS: ${ADDITIONAL_PLUGS:-}
    env_file:
      - ./docker/.local.env
    environment:
      POSTGRES_HOST: 10.10.1.43
      DATABASE_URL: postgres://postgres:postgres@10.10.1.43:5432/care
    volumes:
      - .:/app
    entrypoint: ["bash", "scripts/start-dev.sh"]
    ports:
      - "9000:9000"
      - "9876:9876"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      celery:
        condition: service_healthy

  celery:
    image: care_local
    env_file:
      - ./docker/.local.env
    environment:
      POSTGRES_HOST: 10.10.1.43
      DATABASE_URL: postgres://postgres:postgres@10.10.1.43:5432/care
    entrypoint: ["bash", "scripts/celery-dev.sh"]
    restart: unless-stopped
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    healthcheck:
      test:
        - CMD-SHELL
        - 'celery -A config.celery_app inspect ping -d "celery@$$HOSTNAME"'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 5m
